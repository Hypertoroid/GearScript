    </span>
    <span class="d" aria-hidden="true">4</span>
  </div>
  <h1>This page slipped a tooth</h1>
  <p>Nothing turns here. The address may be mistyped, or the page has moved.</p>
  <div class="path" id="path"></div>
  <nav aria-label="Ways back">
    <a class="primary" href="/" data-to="index.html">Go home</a>
    <a href="/studio.html" data-to="studio.html">Open the studio</a>
    <a href="/help.html" data-to="help.html">Documentation</a>
  </nav>
</main>
<script>
/* this page is served for any missing address (/a/b/c), so relative links would point into the missing folder. Find the site's folder:
   the nearest folder above this address that has studio.html */
(function () {
  var p = location.pathname, el = document.getElementById('path');
  if (!/404(\.html)?$/.test(p)) el.textContent = decodeURIComponent(p);
  document.getElementById('mk').src = document.querySelector('link[rel="icon"]').href;
  var parts = p.split('/').slice(0, -1), tries = [];
  for (var i = parts.length; i >= 1; i--) tries.push(parts.slice(0, i).join('/') + '/');
  (function next() {
    var base = tries.shift(); if (!base) return;
    fetch(base + 'studio.html', { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      if (!r.ok) return next();
      document.querySelectorAll('[data-to]').forEach(function (a) { a.href = base + (a.dataset.to === 'index.html' ? '' : a.dataset.to); });
    }, next);
  })();
})();
</script>
